<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Five independent experts seated around a table reviewing evidence and reports">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16294d"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="400" cy="290" rx="330" ry="170" fill="url(#glow)"/>

  <!-- experts -->
  <g>
    <g transform="translate(160 215)"><path d="M-40 70 a40 40 0 0 1 80 0 Z" fill="#38bdf8"/><circle cy="-6" r="24" fill="#e6ebf5"/></g>
    <g transform="translate(280 150)"><path d="M-40 70 a40 40 0 0 1 80 0 Z" fill="#f59e0b"/><circle cy="-6" r="24" fill="#e6ebf5"/></g>
    <g transform="translate(400 125)"><path d="M-40 70 a40 40 0 0 1 80 0 Z" fill="#34d399"/><circle cy="-6" r="24" fill="#e6ebf5"/></g>
    <g transform="translate(520 150)"><path d="M-40 70 a40 40 0 0 1 80 0 Z" fill="#a78bfa"/><circle cy="-6" r="24" fill="#e6ebf5"/></g>
    <g transform="translate(640 215)"><path d="M-40 70 a40 40 0 0 1 80 0 Z" fill="#f87171"/><circle cy="-6" r="24" fill="#e6ebf5"/></g>
  </g>

  <!-- table -->
  <ellipse cx="400" cy="320" rx="270" ry="95" fill="#1f2f52" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="400" cy="312" rx="240" ry="78" fill="#243a63"/>

  <!-- documents -->
  <g transform="rotate(-10 340 310)">
    <rect x="300" y="262" width="82" height="104" rx="6" fill="#e6ebf5"/>
    <g stroke="#9aa8c4" stroke-width="4" stroke-linecap="round"><path d="M312 286 H370"/><path d="M312 302 H370"/><path d="M312 318 H358"/><path d="M312 334 H366"/></g>
  </g>
  <g transform="rotate(6 440 310)">
    <rect x="410" y="268" width="82" height="104" rx="6" fill="#f3f6fc"/>
    <rect x="422" y="282" width="58" height="30" rx="4" fill="#38bdf8" opacity=".7"/>
    <g stroke="#9aa8c4" stroke-width="4" stroke-linecap="round"><path d="M422 332 H480"/><path d="M422 348 H468"/></g>
  </g>
  <!-- magnifier -->
  <circle cx="535" cy="318" r="24" fill="#ffffff" fill-opacity=".08" stroke="#f59e0b" stroke-width="5"/>
  <line x1="552" y1="336" x2="576" y2="360" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>

  <text x="400" y="458" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#9aa8c4" letter-spacing="3">INDEPENDENT EXPERTS · EVIDENCE · RECOMMENDATIONS</text>
</svg>
