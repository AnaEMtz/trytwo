<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Globe with connected points representing international sanctions regimes">
  <defs>
    <radialGradient id="sphere" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#2a4a82"/><stop offset=".6" stop-color="#15264a"/><stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#f59e0b" stop-opacity=".7"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#38bdf8" stop-opacity=".7"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><circle cx="300" cy="300" r="240"/></clipPath>
  </defs>
  <rect width="600" height="600" fill="#0b1220"/>
  <circle cx="300" cy="300" r="262" fill="none" stroke="#24324f" stroke-width="2"/>
  <circle cx="300" cy="300" r="240" fill="url(#sphere)" stroke="#38bdf8" stroke-width="2"/>

  <g clip-path="url(#clip)" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity=".4">
    <ellipse cx="300" cy="300" rx="240" ry="70"/>
    <ellipse cx="300" cy="190" rx="205" ry="52"/>
    <ellipse cx="300" cy="410" rx="205" ry="52"/>
    <ellipse cx="300" cy="120" rx="120" ry="30"/>
    <ellipse cx="300" cy="480" rx="120" ry="30"/>
    <ellipse cx="300" cy="300" rx="80" ry="240"/>
    <ellipse cx="300" cy="300" rx="160" ry="240"/>
    <line x1="300" y1="60" x2="300" y2="540"/>
  </g>

  <!-- glows -->
  <circle cx="395" cy="215" r="48" fill="url(#glowA)"/>
  <circle cx="215" cy="345" r="42" fill="url(#glowB)"/>
  <circle cx="365" cy="395" r="38" fill="url(#glowA)"/>

  <!-- links -->
  <g fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 6">
    <path d="M215 345 Q300 190 395 215"/>
    <path d="M395 215 Q430 320 365 395"/>
    <path d="M215 345 Q280 430 365 395"/>
  </g>
  <!-- nodes -->
  <g fill="#0b1220" stroke="#e6ebf5" stroke-width="3">
    <circle cx="395" cy="215" r="8"/><circle cx="215" cy="345" r="8"/><circle cx="365" cy="395" r="8"/>
    <circle cx="250" cy="170" r="6"/><circle cx="330" cy="290" r="6"/><circle cx="440" cy="330" r="6"/><circle cx="170" cy="250" r="6"/>
  </g>
</svg>
