<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Network of trade routes with illicit links highlighted under a magnifying glass">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294d"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#f59e0b" stop-opacity=".6"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a3b5e" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)" opacity=".45"/>

  <!-- legitimate trade links -->
  <g stroke="#38bdf8" stroke-width="2" opacity=".5" fill="none">
    <path d="M120 150 L300 90 L520 170 L680 110"/>
    <path d="M120 150 L220 330 L430 360 L640 340"/>
    <path d="M520 170 L640 340"/>
  </g>
  <!-- suspected evasion links -->
  <g stroke="#f59e0b" stroke-width="3" stroke-dasharray="9 8" fill="none">
    <path d="M300 90 L380 230 L430 360"/>
    <path d="M380 230 L220 330"/>
    <path d="M380 230 L520 170"/>
  </g>

  <circle cx="380" cy="230" r="95" fill="url(#glowA)"/>
  <circle cx="430" cy="360" r="70" fill="url(#glowB)"/>

  <!-- nodes -->
  <g fill="#0b1220" stroke="#38bdf8" stroke-width="3">
    <circle cx="120" cy="150" r="11"/><circle cx="300" cy="90" r="11"/>
    <circle cx="520" cy="170" r="11"/><circle cx="680" cy="110" r="11"/>
    <circle cx="220" cy="330" r="11"/><circle cx="430" cy="360" r="11"/>
    <circle cx="640" cy="340" r="11"/>
  </g>
  <circle cx="380" cy="230" r="13" fill="#0b1220" stroke="#f59e0b" stroke-width="4"/>

  <!-- magnifier -->
  <circle cx="380" cy="230" r="64" fill="#ffffff" fill-opacity=".05" stroke="#e6ebf5" stroke-width="6"/>
  <line x1="426" y1="276" x2="482" y2="332" stroke="#e6ebf5" stroke-width="13" stroke-linecap="round"/>

  <!-- cargo ship -->
  <g transform="translate(70 425)">
    <path d="M0 40 H262 L232 82 H30 Z" fill="#1f2f52" stroke="#38bdf8" stroke-width="2"/>
    <rect x="30" y="12" width="50" height="28" fill="#f59e0b"/>
    <rect x="84" y="12" width="50" height="28" fill="#38bdf8"/>
    <rect x="138" y="12" width="50" height="28" fill="#f87171"/>
    <rect x="196" y="-8" width="46" height="48" fill="#2a3b5e" stroke="#38bdf8" stroke-width="2"/>
    <rect x="203" y="2" width="32" height="8" fill="#e6ebf5" opacity=".8"/>
    <path d="M-10 98 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".5"/>
  </g>

  <!-- status tag -->
  <g transform="translate(375 455)">
    <rect width="170" height="36" rx="18" fill="#f59e0b" fill-opacity=".15" stroke="#f59e0b"/>
    <circle cx="20" cy="18" r="5" fill="#f59e0b"/>
    <text x="34" y="23" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#f59e0b">AIS SIGNAL OFF</text>
  </g>
</svg>
