<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Two tankers conducting a ship-to-ship transfer with the tracking signal switched off">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1b2d52"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12335c"/><stop offset="1" stop-color="#0a1a33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#e6ebf5" opacity=".6">
    <circle cx="80" cy="60" r="2"/><circle cx="220" cy="110" r="1.5"/><circle cx="470" cy="50" r="2"/>
    <circle cx="640" cy="90" r="1.5"/><circle cx="730" cy="40" r="2"/><circle cx="360" cy="140" r="1.5"/>
  </g>
  <circle cx="680" cy="150" r="34" fill="#e6ebf5" opacity=".9"/>
  <circle cx="694" cy="142" r="30" fill="#16213a"/>

  <rect y="330" width="800" height="170" fill="url(#sea)"/>
  <path d="M0 350 q20 -9 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".35"/>
  <path d="M0 430 q20 -9 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".25"/>

  <!-- tanker A -->
  <g>
    <path d="M60 330 H365 L338 388 H88 Z" fill="#1f2f52" stroke="#38bdf8" stroke-width="2"/>
    <rect x="290" y="282" width="50" height="48" fill="#2a3b5e" stroke="#38bdf8" stroke-width="2"/>
    <rect x="298" y="292" width="34" height="8" fill="#e6ebf5" opacity=".8"/>
    <g stroke="#9aa8c4" stroke-width="3" fill="none"><path d="M100 322 H270"/><path d="M120 322 V312 M160 322 V312 M200 322 V312 M240 322 V312"/></g>
    <rect x="88" y="340" width="250" height="8" fill="#f87171" opacity=".7"/>
  </g>
  <!-- tanker B -->
  <g>
    <path d="M440 340 H735 L712 392 H464 Z" fill="#243a63" stroke="#f59e0b" stroke-width="2"/>
    <rect x="440" y="296" width="44" height="44" fill="#2a3b5e" stroke="#f59e0b" stroke-width="2"/>
    <rect x="447" y="305" width="30" height="8" fill="#e6ebf5" opacity=".8"/>
    <g stroke="#9aa8c4" stroke-width="3" fill="none"><path d="M510 332 H700"/><path d="M530 332 V322 M575 332 V322 M620 332 V322 M665 332 V322"/></g>
    <rect x="464" y="350" width="240" height="8" fill="#38bdf8" opacity=".6"/>
  </g>
  <!-- transfer hose -->
  <path d="M365 346 Q402 386 440 354" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="10 7" stroke-linecap="round"/>

  <!-- AIS off icon -->
  <g transform="translate(200 175)">
    <circle r="46" fill="#16213a" stroke="#38bdf8" stroke-width="3"/>
    <circle cy="14" r="5" fill="#38bdf8"/>
    <path d="M-14 4 a20 20 0 0 1 28 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M-26 -8 a38 38 0 0 1 52 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-34" y1="-34" x2="34" y2="34" stroke="#f87171" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="200" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6ebf5">Tracking signal off</text>
  <line x1="200" y1="258" x2="200" y2="285" stroke="#9aa8c4" stroke-dasharray="4 4"/>

  <text x="402" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f59e0b">Ship-to-ship transfer</text>
  <line x1="402" y1="308" x2="402" y2="350" stroke="#f59e0b" stroke-dasharray="4 4"/>
</svg>
